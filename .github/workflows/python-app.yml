# Run the cross-platform Python test suite.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    name: Py${{ matrix.python }} • ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        python: [ '3.9', '3.10', '3.11', '3.12', '3.13', '3.14', '3.15' ]
    steps:
      - uses: actions/checkout@v4
      - name: Install external Node.js for legacy ZK compatibility tests
        uses: actions/setup-node@v4
        with:
          node-version: '22.17.1'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      # ckzg has no CPython 3.15 wheel. Keep the wheel requirement for other dependencies.
      - name: Install dependencies
        if: runner.os != 'Windows' || matrix.python != '3.15'
        run: >-
          python -m pip install --only-binary=:all:
          ${{ matrix.python == '3.15' && '--no-binary=ckzg' || '' }}
          -r requirements.txt
      - name: Install dependencies with MSVC for Python 3.15
        if: runner.os == 'Windows' && matrix.python == '3.15'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsRoot = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsRoot) { throw 'Visual Studio x64 C++ tools are required to build ckzg.' }
          & (Join-Path $vsRoot 'Common7\Tools\Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation

          # ckzg also invokes GNU Make and a POSIX shell to build blst.
          $msvcBin = Split-Path (Get-Command cl.exe -ErrorAction Stop).Source
          $gitRoot = Split-Path (Split-Path (Get-Command git.exe -ErrorAction Stop).Source)
          $gitTools = Join-Path $gitRoot 'usr\bin'
          $env:Path = "$msvcBin;$gitTools;$env:Path"
          $env:SHELL = 'sh.exe'
          Get-Command sh.exe, gcc.exe, ar.exe -ErrorAction Stop | Out-Null
          $make = Get-Command make.exe, mingw32-make.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $make) {
            choco install make --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $make = Get-Command make.exe -ErrorAction Stop
          }
          $env:MAKE = $make.Name
          python -m pip install --only-binary=:all: --no-binary=ckzg -r requirements.txt
      - name: Install witness test dependency
        run: python -m pip install esprima==4.0.1
      - name: Verify witness AOT program
        run: python -u -m zk.groth16.generate_witness_program --check
      - name: Run pytest
        run: python -u -m pytest -v
